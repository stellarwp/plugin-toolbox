# Builds and packages a version of the plugin with pup: `pup build`, `pup check`, `pup i18n`, then
# `pup package <version>`. The version is the one zip-name resolved, pre-release suffix included: pup
# writes it into the version files inside the zip and leaves the checkout as it was. The zip lands
# in the root of the checkout, where the caller uploads it as an artifact or syncs it to S3.
#
# The logic lives in release-zip.js, run by actions/github-script, so there is no dependency to
# install and nothing to build. pup is downloaded into the runner's temp directory and runs on the
# runner's PHP, which the caller sets up at the version the plugin's vendor directory needs.
name: Release zip
description: Builds, checks and packages a version of the plugin with pup

inputs:
  version:
    description: >-
      The version the zip carries, the `version` output of zip-name: the base version for a
      production build, with the pre-release suffix for a QA build. pup writes it into the version
      files inside the zip. Empty fails before anything runs.
    required: true
  production:
    description: >-
      `yes` runs `pup check` strict, so a `TBD` left behind or a version conflict fails the build;
      `no` runs it with `--dev`, where the same findings are warnings. Anything else fails before
      anything runs.
    required: false
    default: 'no'
  check:
    description: '`yes` runs `pup check`; `no` skips it. Anything else fails before anything runs.'
    required: false
    default: 'yes'
  i18n:
    description: '`yes` runs `pup i18n`, which downloads the finished translations; `no` skips it. Anything else fails before anything runs.'
    required: false
    default: 'yes'
  pup-version:
    description: >-
      The pup release that builds and packages: a release number, such as 2.0.0, or 'latest' for the
      newest release. It has to ship a pup.phar asset, which every release from 1.2.4 to 2.0.0 does;
      a release without one fails the step and names a pin to use instead. Pass the same value
      zip-name got, so the zip is named by the pup that read the version.
    required: false
    default: 'latest'
  token:
    description: >-
      Authenticates the 'latest' lookup of pup-version against the GitHub API, so the runner's shared
      quota is not spent. A pinned pup-version never uses it.
    required: false
    default: ${{ github.token }}

outputs:
  zip-name:
    description: 'The zip name without `.zip`, as `pup zip-name` gives it for the version built.'
    value: ${{ steps.zip.outputs.zip-name }}
  zip-path:
    description: 'The zip pup wrote, `<zip-name>.zip` in the root of the checkout, as an absolute path.'
    value: ${{ steps.zip.outputs.zip-path }}

runs:
  using: 'composite'
  steps:
    - name: Build, check and package the version
      id: zip
      uses: actions/github-script@v9
      env:
        # github-script's require() resolves against the workspace of the repository being built,
        # not this action's directory, so the path has to be passed in. github.action_path is the
        # documented expression for it.
        ACTION_PATH: ${{ github.action_path }}
        # Read from process.env rather than interpolated into the script, so an input is data and
        # never part of the program.
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PRODUCTION: ${{ inputs.production }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_I18N: ${{ inputs.i18n }}
        INPUT_PUP_VERSION: ${{ inputs.pup-version }}
        INPUT_TOKEN: ${{ inputs.token }}
      with:
        script: |
          const { runZip } = require(`${process.env.ACTION_PATH}/release-zip.js`)
          await runZip({ core, exec, env: process.env })
