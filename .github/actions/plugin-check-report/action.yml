# Compares a WordPress.org Plugin Check results file with a baseline: the counts per rule in a file
# the repository commits, `.plugin-check-baseline.json`. Only a rule with more errors than the
# baseline fails (baseline mode), or any error at all (strict mode). It also saves this run's counts
# as a new baseline, to copy into the repository, and writes the short body for the pull request
# comment.
#
# It does not run Plugin Check and it does not post the comment. The reusable workflow
# .github/workflows/plugin-check.yml does both, so this action stays usable with a results file
# from anywhere. It does write the comment's body, with the "Check Finished" badge, and a body that
# says Plugin Check could not run when there was nothing to compare.
#
# The work is in one JavaScript file next to this file, plugin-check-report.js. Each step below is
# an actions/github-script step that requires it by path, so there is nothing to build: the file in
# the repository is the file that runs. The same file runs from a command line; see the README.
name: Plugin Check report
description: Compares Plugin Check results with the repository's baseline file, and saves a new baseline

inputs:
  results:
    description: >-
      Path of the results file wordpress/plugin-check-action writes, `plugin-check-results.txt`. A
      missing file fails the compare step: that is how a broken build or a broken check shows up.
    required: true
  comment-file:
    description: >-
      Where to write the short Markdown body for the pull request comment. Empty writes none. The
      file is only written when the compare runs, so a caller can tell "no result" from a result.
    required: false
    default: ''
  mode:
    description: >-
      `baseline`: fail only when a rule has more errors than the baseline. `strict`: fail on any
      error, baseline or not.
    required: false
    default: 'baseline'
  comment-marker:
    description: >-
      Hidden first line of the comment body, which the caller searches for to find its own
      comment. Empty uses `<!-- plugin-check:<owner>/<repo> -->`.
    required: false
    default: ''
  baseline-file:
    description: >-
      Path of the baseline file the repository commits: `{"errors": {code: n}, "warnings": {code: n}}`.
      A relative path is read from the working directory.
    required: false
    default: '.plugin-check-baseline.json'
  base-results:
    description: >-
      Path of the Plugin Check results of the pull request's target branch. Used as the baseline when
      there is no baseline file, so a pull request is still compared with something. Empty when
      nothing was checked on the target branch. Not used in `strict` mode.
    required: false
    default: ''
  base-required:
    description: >-
      `true` when the caller checked the target branch because there is no baseline file. A missing
      `base-results` file then fails the compare, so a target branch that could not be checked never
      passes as "no baseline".
    required: false
    default: 'false'

outputs:
  artifact-url:
    description: 'Link to the plugin-check-report artifact this run uploaded. Empty when there was nothing to upload.'
    value: ${{ steps.artifact.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    # One folder per run under RUNNER_TEMP, cleared first, so a second use of the action in the same
    # job never reads the first one's files.
    - name: Set file paths
      id: paths
      uses: actions/github-script@v9
      env:
        # github-script's require() resolves against the workspace of the repository being built,
        # not this action's directory, so the path has to be passed in.
        ACTION_PATH: ${{ github.action_path }}
        INPUT_COMMENT_MARKER: ${{ inputs.comment-marker }}
      with:
        script: |
          const { runPaths } = require(`${process.env.ACTION_PATH}/plugin-check-report.js`)
          process.exitCode = runPaths({ core, env: process.env })

    # A baseline made from this run, uploaded even when the compare below fails. It is the easy way
    # to update the committed file: download the artifact and copy its baseline.json.
    - name: Write a new baseline
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESULTS: ${{ inputs.results }}
        REPORT_DIR: ${{ steps.paths.outputs.report }}
      with:
        script: |
          const { runUpdate } = require(`${process.env.ACTION_PATH}/plugin-check-report.js`)
          process.exitCode = runUpdate({ core, env: process.env })

    # The comment links to this artifact: the results, and the new baseline.json.
    - name: Upload the report
      id: artifact
      uses: actions/upload-artifact@v7
      with:
        name: plugin-check-report
        path: ${{ steps.paths.outputs.report }}
        if-no-files-found: ignore

    # Fails the step when the mode says so. Also writes the comment body and the same text to the
    # job summary. The step ends with an exit status, not an extra error annotation: the messages
    # above it already say what is wrong.
    - name: Compare with the baseline
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESULTS: ${{ inputs.results }}
        COMMENT_FILE: ${{ inputs.comment-file }}
        PLUGIN_CHECK_MODE: ${{ inputs.mode }}
        PLUGIN_CHECK_BASELINE: ${{ inputs.baseline-file }}
        PLUGIN_CHECK_BASE_RESULTS: ${{ inputs.base-results }}
        PLUGIN_CHECK_BASE_REQUIRED: ${{ inputs.base-required }}
        COMMENT_MARKER: ${{ steps.paths.outputs.marker }}
        ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        script: |
          const { runCompare } = require(`${process.env.ACTION_PATH}/plugin-check-report.js`)
          process.exitCode = runCompare({ core, env: process.env })

    # When the build or the check broke, the compare wrote no body. Say so, instead of leaving "in
    # progress" behind. Runs after a failed step too, but not when the run was cancelled. A body the
    # compare wrote is left as it is.
    - name: Write the comment if the compare could not run
      if: ${{ !cancelled() && inputs.comment-file != '' }}
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        COMMENT_FILE: ${{ inputs.comment-file }}
        COMMENT_MARKER: ${{ inputs.comment-marker || format('<!-- plugin-check:{0} -->', github.repository) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        script: |
          const { runCouldNotRun } = require(`${process.env.ACTION_PATH}/plugin-check-report.js`)
          process.exitCode = runCouldNotRun({ core, env: process.env })
