# Checks out slic, configures it for CI and provisions the WordPress stack. Running a suite is a
# separate action: see .github/actions/run-slic-suite.
name: Set up slic
description: Checks out slic, configures it for CI and provisions the WordPress stack

inputs:
  # Required.
  target:
    description: >-
      The project to select with `slic use`, e.g. sfwd-lms or sfwd-lms/common.
      Use `site` for a WordPress site rooted at here-dir.
    required: true

  # Optional, but recommended in CI.
  php-version:
    description: >-
      The PHP version to set up in slic, e.g. 8.3. Recommended in CI, and needed in practice for a
      matrix over PHP versions, since every leg otherwise resolves to the same version. Left empty,
      slic resolves it from its environment, project configuration or defaults. The action reports
      and pins the resolved version before installing dependencies.
    required: false
    default: ''

  # Optional.
  here-dir:
    description: >-
      The directory `slic here` runs in: the parent of plugin checkouts, a directory named
      `themes` for theme checkouts, or the WordPress site root for target `site`.
      Defaults to the workspace. A plugin checked out at the workspace root uses the workspace's
      parent. See the README for layout examples.
    required: false
    default: ''
  ref:
    description: 'The slic branch, tag or commit to check out.'
    required: false
    default: 'main'
  slic-repository:
    description: 'The repository to check slic out from.'
    required: false
    default: 'stellarwp/slic'
  slic-path:
    description: 'Path relative to the workspace to check slic out into.'
    required: false
    default: 'slic'
  wp-version:
    description: >-
      The WordPress version to put in place. `latest` resolves the newest release from
      api.wordpress.org, which is sometimes newer than the one baked into the slic image. An
      explicit version such as 6.6 pins it. The default empty value leaves the image's version alone.
    required: false
    default: ''
  composer-install:
    description: >-
      Targets to run `slic composer install` for inside slic, one per line, as
      `<slic target> [composer args]`. Each line selects that target only when it differs from the current selection. Leave
      empty when Composer already ran on the host, e.g. through ramsey/composer-install.
    required: false
    default: ''
  composer-cache:
    description: 'Restore and save Composer downloads with actions/cache. Disable if the caller manages caching.'
    required: false
    default: 'true'
  composer-cache-dir:
    description: >-
      Host Composer cache directory to mount in Slic. When omitted, detect it with host Composer
      if available. Managed caching otherwise uses a directory under the runner's temporary directory.
    required: false
    default: ''
  slic-debug:
    description: 'Enable Slic diagnostic logging. Independent of Xdebug and test-runner debug output.'
    required: false
    default: 'true'
  xdebug:
    description: 'Enable Xdebug in the PHP containers after setup. Disables PCOV when enabled.'
    required: false
    default: 'false'

outputs:
  slic-bin:
    description: 'Absolute path to the slic binary. Also exported to the environment as SLIC_BIN.'
    value: ${{ steps.env.outputs.slic-bin }}
  target:
    description: >-
      The target this action selected. Also exported to the environment as SLIC_TOOLBOX_TARGET,
      which run-slic-suite reads when it is given no target of its own.
    value: ${{ steps.target.outputs.target }}
  php-version:
    description: >-
      The PHP version the stack is running, whether it came from the php-version input or from
      slic resolving it. Also exported to the environment as SLIC_PHP_VERSION.
    value: ${{ steps.php-version.outputs.php-version }}

runs:
  using: 'composite'
  steps:
    - name: Resolve the Composer cache directory
      id: composer-cache-dir
      shell: bash
      env:
        CACHE_DIR_OVERRIDE: ${{ inputs.composer-cache-dir }}
        MANAGE_CACHE: ${{ inputs.composer-cache }}
      run: |
        # Do not shadow COMPOSER_CACHE_DIR: host Composer may already use that override.
        cache_dir="${CACHE_DIR_OVERRIDE}"

        if [ -z "${cache_dir}" ] && command -v composer > /dev/null 2>&1; then
          composer_args=(config cache-dir --absolute)

          # Subdirectory checkouts may leave the workspace without a Composer manifest.
          if [ ! -f "${COMPOSER:-composer.json}" ]; then
            composer_args+=(--global)
          fi

          if ! cache_dir=$(composer "${composer_args[@]}"); then
            echo "::error::Could not detect the host Composer cache directory. Fix Composer configuration or supply composer-cache-dir."
            exit 1
          fi

          if [ -z "${cache_dir}" ]; then
            echo "::error::Host Composer returned an empty cache directory. Supply composer-cache-dir."
            exit 1
          fi
        fi

        if [ -z "${cache_dir}" ] && [ "${MANAGE_CACHE}" == "true" ]; then
          cache_dir="${RUNNER_TEMP}/slic-composer-cache"
        fi

        if [ -n "${cache_dir}" ]; then
          # Resolve relative overrides once so caching and the Docker mount use the same path.
          cache_dir=$(realpath -m -- "${cache_dir}")
          # Docker would create a missing bind-mount directory as root on a cold cache.
          mkdir -p -- "${cache_dir}"
        fi

        echo "path=${cache_dir}" >> "$GITHUB_OUTPUT"

    - name: Checkout slic
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.slic-repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.slic-path }}
        fetch-depth: 1

    # ------------------------------------------------------------------------------
    # SLIC_PHP_VERSION is exported so that slic reads it as a command-line override.
    # slic backs the variable up before it loads any env file, and a value that was
    # already in the environment wins over the version a target's slic.json or
    # composer.json asks for. Without it, `php-version set --skip-rebuild` only stages
    # a version that the FIRST `slic use` consumes, and any later `slic use` switches
    # the stack to the target's own PHP requirement instead.
    # ------------------------------------------------------------------------------
    - name: Set up slic env vars
      id: env
      shell: bash
      env:
        SLIC_PATH: ${{ inputs.slic-path }}
        PHP_VERSION: ${{ inputs.php-version }}
      run: |
        # Add special env vars for the slic containers.
        {
          echo "SLIC_BIN=${GITHUB_WORKSPACE}/${SLIC_PATH}/slic"
          echo "SLIC_WP_DIR=${GITHUB_WORKSPACE}/${SLIC_PATH}/_wordpress"
        } >> "$GITHUB_ENV"

        # Pin an explicit matrix version; otherwise let the main target choose it.
        if [ -n "${PHP_VERSION}" ]; then
          echo "SLIC_PHP_VERSION=${PHP_VERSION}" >> "$GITHUB_ENV"
        fi

        echo "slic-bin=${GITHUB_WORKSPACE}/${SLIC_PATH}/slic" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------------
    # slic's is_ci() checks CI, along with GITHUB_ACTION, which the runner already
    # sets. Setting it explicitly keeps the action correct on a runner that does not.
    # ------------------------------------------------------------------------------
    - name: Set the CI run context
      shell: bash
      run: echo "CI=1" >> "$GITHUB_ENV"

    - name: Prepare ssh-agent
      shell: bash
      run: |
        # ssh-add returns 1 for a usable agent with no keys, and 2 when unavailable.
        agent_status=0
        ssh-add -l > /dev/null 2>&1 || agent_status=$?

        if [ "${agent_status}" -le 1 ]; then
          echo "Using the existing ssh-agent."
        else
          agent_dir=$(mktemp -d "${RUNNER_TEMP}/slic-ssh.XXXXXX")

          if ! agent_env=$(ssh-agent -a "${agent_dir}/agent.sock"); then
            rmdir "${agent_dir}"
            exit 1
          fi

          eval "${agent_env}"
          {
            echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}"
            echo "SSH_AGENT_PID=${SSH_AGENT_PID}"
            echo "SLIC_TOOLBOX_SSH_AGENT_PID=${SSH_AGENT_PID}"
            echo "SLIC_TOOLBOX_SSH_AGENT_DIR=${agent_dir}"
          } >> "$GITHUB_ENV"
        fi

    # ------------------------------------------------------------------------------
    # `slic here` has no path argument: it reads the current working directory and
    # establishes the plugin, theme, or site layout for subsequent target selection.
    # ------------------------------------------------------------------------------
    - name: Set up slic for CI
      shell: bash
      env:
        HERE_DIR: ${{ inputs.here-dir }}
        PHP_VERSION: ${{ inputs.php-version }}
        CACHE_DIR: ${{ steps.composer-cache-dir.outputs.path }}
      run: |
        cd "${HERE_DIR:-$GITHUB_WORKSPACE}"

        # Allow an always() cleanup step to handle partial setup failures too.
        echo "SLIC_TOOLBOX_STACK_CONFIGURED=true" >> "$GITHUB_ENV"
        "${SLIC_BIN}" here
        "${SLIC_BIN}" interactive off
        "${SLIC_BIN}" build-prompt off
        "${SLIC_BIN}" build-subdir off

        if [ -n "${CACHE_DIR}" ]; then
          "${SLIC_BIN}" composer-cache set "${CACHE_DIR}"
        else
          echo "Host Composer is unavailable; keeping Slic's existing cache configuration."
        fi

        # With no version named, `slic use` resolves one from the target instead.
        if [ -n "${PHP_VERSION}" ]; then
          "${SLIC_BIN}" php-version set "${PHP_VERSION}" --skip-rebuild
        fi

    - name: Configure Slic diagnostic logging
      shell: bash
      env:
        SLIC_DEBUG: ${{ inputs.slic-debug }}
      run: |
        if [ "${SLIC_DEBUG}" == "true" ]; then
          "${SLIC_BIN}" debug on
          "${SLIC_BIN}" config
        else
          "${SLIC_BIN}" debug off
        fi

    - name: Select the target under test
      id: target
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        "${SLIC_BIN}" use "${TARGET}"

        # run-slic-suite reads this when no target is passed to it, so a job names
        # the target once. slic records the selection in its own run settings file
        # rather than in the environment, so there is nothing else to read it from.
        echo "SLIC_TOOLBOX_TARGET=${TARGET}" >> "$GITHUB_ENV"
        echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------------
    # The container is the authority on which PHP is running, whether the caller
    # named a version or slic resolved one from the target. Record it either way, so
    # the rest of the job and the artifact name have a version to work from and a
    # later `slic use` cannot move the stack off it.
    # ------------------------------------------------------------------------------
    - name: Resolve the PHP version slic is running
      id: php-version
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
      run: |
        # A target matching Slic's default PHP may not have started the stack yet.
        "${SLIC_BIN}" up slic
        FULL_VERSION=$("${SLIC_BIN}" dc exec wordpress php -v | grep -oP '^PHP \K[\d\.]+')

        if [ -z "${FULL_VERSION}" ]; then
          echo "::error::Could not read the PHP version from the WordPress container."
          exit 1
        fi

        # slic names versions as major.minor, and so does the artifact. Recording the
        # patch would move the artifact name on every PHP release.
        ACTUAL_VERSION=$(printf '%s' "${FULL_VERSION}" | cut -d. -f1,2)

        echo "The WordPress container is running PHP ${FULL_VERSION}."

        if [ -z "${PHP_VERSION}" ]; then
          echo "::warning::php-version was not set, so slic selected PHP ${ACTUAL_VERSION} using its configuration and defaults. Set php-version to pin it, which a matrix over PHP versions has to do."
        elif [ "${ACTUAL_VERSION}" == "${PHP_VERSION}" ]; then
          echo "PHP ${ACTUAL_VERSION} matches the requested ${PHP_VERSION}."
        else
          echo "::error::Expected PHP ${PHP_VERSION}, but the container is running ${FULL_VERSION}."
          exit 1
        fi

        # Pin the verified version before installing any secondary targets.
        echo "SLIC_PHP_VERSION=${ACTUAL_VERSION}" >> "$GITHUB_ENV"
        echo "php-version=${ACTUAL_VERSION}" >> "$GITHUB_OUTPUT"
        echo "## slic is running PHP ${FULL_VERSION}" >> "$GITHUB_STEP_SUMMARY"

    - name: Build the Composer cache key
      id: composer-cache-key
      if: inputs.composer-cache == 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        COMPOSER_INSTALL: ${{ inputs.composer-install }}
        HERE_DIR: ${{ inputs.here-dir }}
        PHP_VERSION: ${{ steps.php-version.outputs.php-version }}
      run: bash "${GITHUB_ACTION_PATH}/../composer-cache-key.sh"

    # Restore after resolving PHP, but before any requested Composer installation.
    # Broader prefixes share downloads without making different installs compete to save one key.
    - name: Restore Composer downloads
      if: inputs.composer-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache-dir.outputs.path }}
        key: ${{ steps.composer-cache-key.outputs.key }}
        restore-keys: ${{ steps.composer-cache-key.outputs.restore-keys }}

    # ------------------------------------------------------------------------------
    # Repos whose dependencies have to be installed with the container's PHP, rather
    # than the runner's, install them here. Each line selects its target first, so a
    # target and its shared library can be installed with different flags.
    # ------------------------------------------------------------------------------
    - name: Install Composer dependencies inside slic
      if: inputs.composer-install != ''
      shell: bash
      env:
        COMPOSER_INSTALL: ${{ inputs.composer-install }}
      run: |
        source "${GITHUB_ACTION_PATH}/../slic-target.sh"
        set -f

        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"

          if [ -z "${line}" ] || [ "${line:0:1}" == "#" ]; then
            continue
          fi

          # Word splitting is intended: the target is followed by Composer arguments.
          # shellcheck disable=SC2086
          set -- ${line}
          target="$1"
          shift

          echo "::group::slic composer install for ${target}"
          select_slic_target "${target}"
          "${SLIC_BIN}" composer install "$@"
          echo "::endgroup::"
        done <<< "${COMPOSER_INSTALL}"

    - name: Restore the target under test
      if: inputs.composer-install != ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        source "${GITHUB_ACTION_PATH}/../slic-target.sh"
        select_slic_target "${TARGET}"

    # ------------------------------------------------------------------------------
    # `wp core download --force` replaces the core files without touching the
    # database, so it both upgrades and downgrades.
    #
    # Any `slic wp` command installs WordPress first if it is not installed yet, so
    # this one creates the database at the version baked into the image and only then
    # swaps the files. `wp core update-db` reconciles the schema with the files that
    # are now on disk; it is a no-op when the two already agree.
    # ------------------------------------------------------------------------------
    - name: Put the requested WordPress version in place
      if: inputs.wp-version != ''
      shell: bash
      env:
        WP_VERSION: ${{ inputs.wp-version }}
      run: |
        if [ "${WP_VERSION}" == "latest" ]; then
          # The version baked into the slic image is sometimes behind the latest release.
          WP_VERSION=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 \
            "https://api.wordpress.org/core/version-check/1.7/" \
            | jq -r '[.offers[]|select(.response=="upgrade")][0].version')
        fi

        if [ -z "${WP_VERSION}" ] || [ "${WP_VERSION}" == "null" ]; then
          echo "::error::Could not resolve a WordPress version to install."
          exit 1
        fi

        "${SLIC_BIN}" wp core download --version="${WP_VERSION}" --force
        "${SLIC_BIN}" wp core update-db

    - name: Show slic info
      shell: bash
      run: |
        "${SLIC_BIN}" info
        "${SLIC_BIN}" wp core version

    - name: Configure Xdebug for the test run
      shell: bash
      env:
        XDEBUG_ENABLED: ${{ inputs.xdebug }}
      run: |
        # Apply this after target switches so it updates the containers tests will use.
        if [ "${XDEBUG_ENABLED}" == "true" ]; then
          "${SLIC_BIN}" xdebug on --yes
        else
          "${SLIC_BIN}" xdebug off
        fi
