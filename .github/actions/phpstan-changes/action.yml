# Decides whether a pull request has to run PHPStan. Used by .github/workflows/phpstan.yml, which
# has no checkout at this point: the files of a pull request come from the API.
#
# The work lives in changes.js. actions/github-script runs it with a pre-authenticated Octokit, so
# there is no dependency to install and nothing to build.
name: PHPStan changes
description: Says whether PHPStan has to run, from the event, the draft state and the files a pull request changes

inputs:
  changed-files:
    description: >-
      Globs, one per line. A pull request runs PHPStan only when it changes a file one of them
      matches. `*` also matches `/`, so `*.php` is every PHP file. An empty string (`''`) always
      runs.
    required: false
    default: ''
  skip-draft-prefixes:
    description: >-
      Branch prefixes, one per line, whose draft pull requests skip PHPStan. A draft of
      `release/1.2` skips when a prefix is `release/`. An empty string (`''`) means drafts run.
    required: false
    default: ''
  token:
    description: 'Token that lists the files of the pull request. It needs `pull-requests: read`.'
    required: false
    default: ${{ github.token }}

outputs:
  run:
    description: '`true` when PHPStan has to run, `false` when it can be skipped.'
    value: ${{ steps.decide.outputs.run }}

runs:
  using: 'composite'
  steps:
    - name: Decide whether PHPStan has to run
      id: decide
      uses: actions/github-script@v9
      env:
        # github-script's require() resolves against the workspace of the repository being built,
        # not this action's directory, so the path has to be passed in. github.action_path is the
        # documented expression for it.
        ACTION_PATH: ${{ github.action_path }}
        # Read from process.env rather than interpolated into the script, so an input is data and
        # never part of the program.
        EVENT_NAME: ${{ github.event_name }}
        DRAFT: ${{ github.event.pull_request.draft }}
        HEAD_REF: ${{ github.head_ref }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        INPUT_SKIP_DRAFT_PREFIXES: ${{ inputs.skip-draft-prefixes }}
        INPUT_CHANGED_FILES: ${{ inputs.changed-files }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { run } = require(`${process.env.ACTION_PATH}/changes.js`)
          await run({ github, core, env: process.env })
