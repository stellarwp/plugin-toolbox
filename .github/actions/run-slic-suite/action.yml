# Runs a Codeception suite through slic. Provisioning the stack is a separate action: see
# .github/actions/setup-slic, which must run first in the same job.
name: Run a slic suite
description: Runs a Codeception suite through slic, uploads its output on failure

inputs:
  suite:
    description: 'The Codeception suite to run, e.g. integration or wpunit.'
    required: true
  target:
    description: >-
      The slic target the suite belongs to, e.g. sfwd-lms. Defaults to the one setup-slic selected,
      so a job names its target once. Pass it to run against a different target. The action checks
      Slic's current selection and calls `slic use` only when needed.
    required: false
    default: ''
  suite-args:
    description: 'Extra arguments appended to `slic run`, e.g. --ext DotReporter.'
    required: false
    default: ''
  debug:
    description: 'Add Codeception --debug output for this suite. Does not enable Slic logging or Xdebug.'
    required: false
    default: 'false'
  upload-output-on-failure:
    description: 'Upload the target test output directory as an artifact when the suite fails.'
    required: false
    default: 'false'
  output-path:
    description: >-
      Path from the workspace to the directory the suite writes output to. Defaults to
      `<target>/tests/_output/`.
    required: false
    default: ''
  output-artifact-name:
    description: >-
      Name of the uploaded artifact. Defaults to `test-output-<target>-php<version>-<suite>`, reading the
      version setup-slic pinned the stack to, so a matrix over PHP versions names each leg without
      repeating the value here.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------------------
    # setup-slic exports SLIC_BIN, SLIC_PHP_VERSION and SLIC_TOOLBOX_TARGET. Fail with a clear message rather than letting an empty
    # ${SLIC_BIN} run the suite name as a command.
    # ------------------------------------------------------------------------------
    - name: Run suite ${{ inputs.suite }}
      id: run
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        SUITE_ARGS: ${{ inputs.suite-args }}
        DEBUG: ${{ inputs.debug }}
        TARGET: ${{ inputs.target }}
        ARTIFACT_NAME: ${{ inputs.output-artifact-name }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        if [ -z "${SLIC_BIN:-}" ]; then
          echo "::error::SLIC_BIN is not set. Run the setup-slic action earlier in this job."
          exit 1
        fi

        if [ -z "${TARGET}" ]; then
          TARGET="${SLIC_TOOLBOX_TARGET:-}"
        fi

        if [ -z "${TARGET}" ]; then
          echo "::error::No slic target. Run the setup-slic action earlier in this job, or pass target."
          exit 1
        fi

        # Resolve the artifact name and path before the suite runs: the upload step
        # needs them on the run that fails, and a step's outputs survive its failure
        # only for what it wrote before failing.
        if [ -z "${OUTPUT_PATH}" ]; then
          OUTPUT_PATH="${TARGET}/tests/_output/"
        fi

        # The name carries every dimension a job can vary: the target, the PHP version
        # setup-slic pinned the stack to, and the suite. The upload overwrites a
        # matching name so re-running a failed job replaces its own output from the
        # earlier attempt, which means a name shared with a different job would
        # destroy that job's output instead.
        if [ -z "${ARTIFACT_NAME}" ]; then
          # An artifact name cannot contain / : < > | * ? " or \, and a target can be
          # a subdirectory such as the-events-calendar/common.
          safe_target="$(printf '%s' "${TARGET}" | tr -c 'a-zA-Z0-9._-' '-')"

          ARTIFACT_NAME="test-output-${safe_target}"

          if [ -n "${SLIC_PHP_VERSION:-}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}-php${SLIC_PHP_VERSION}"
          fi

          ARTIFACT_NAME="${ARTIFACT_NAME}-${SUITE}"
        fi

        {
          echo "artifact-name=${ARTIFACT_NAME}"
          echo "output-path=${OUTPUT_PATH}"
        } >> "$GITHUB_OUTPUT"

        source "${GITHUB_ACTION_PATH}/../slic-target.sh"
        select_slic_target "${TARGET}"

        debug_args=()

        if [ "${DEBUG}" == "true" ]; then
          debug_args+=(--debug)
        fi

        set -f
        # Word splitting is intended for the whitespace-separated suite options.
        # shellcheck disable=SC2086
        "${SLIC_BIN}" run "${SUITE}" ${SUITE_ARGS} "${debug_args[@]}"

    - name: Upload failed test data as an artifact
      if: failure() && steps.run.outcome == 'failure' && steps.run.outputs.output-path != '' && inputs.upload-output-on-failure == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: ${{ steps.run.outputs.output-path }}
        retention-days: 2
        overwrite: true
