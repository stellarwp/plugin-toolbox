# Prepares a release branch: bumps the version, replaces the TBD placeholders, writes the changelog,
# then commits that to the branch through the GitHub API. It opens no pull request, so the change
# is reviewed wherever the release itself is reviewed.
#
# The checks and the commit live in release-prep.js, run by actions/github-script, so there is no
# dependency to install and nothing to build. The changelog is written by the changelogger's own
# action between the two script steps, rather than reimplemented here.
name: Release prep
description: Bumps the version, replaces TBDs and writes the changelog, then commits it to the release branch

inputs:
  branch:
    description: >-
      The release branch to commit the preparation to, e.g. `release/M26.jigglypuff`. A branch name, not
      any git ref. The action does not check it out: the caller's checkout has to be on it, and the
      action refuses to run when it is not.
    required: true
  version:
    description: >-
      The version to prepare. It is validated against the versioning strategy the repository's
      changelogger configures: three or four numeric parts for `stellarwp`, a semver version for
      `semver` or no configuration, no shape check for a custom strategy. An empty value and a
      version lower than the one the branch already has are refused before anything is changed.
    required: true
  date:
    description: >-
      The release date for the changelog, as `YYYY-MM-DD`. Empty or `today` writes today's date in
      UTC.
    required: false
    default: ''
  token:
    description: >-
      Token the commit is created with, through the GitHub API. It needs `contents: write` on the
      repository, so the job needs that permission too. Nothing is pushed with git, so the checkout
      can use `persist-credentials: false`.
    required: false
    default: ${{ github.token }}
  pup-version:
    description: >-
      The pup release that bumps the version and replaces the TBDs: a release number, such as
      2.0.0, or 'latest' for the newest release. It has to ship a pup.phar asset, which every
      release from 1.2.4 to 2.0.0 does. A release without one is not supported yet: the action
      fails and names a pin to use instead.
    required: false
    default: 'latest'

outputs:
  version:
    description: 'The version prepared.'
    value: ${{ steps.prepare.outputs.version }}
  date:
    description: 'The date written in the changelog, as `YYYY-MM-DD`.'
    value: ${{ steps.prepare.outputs.date }}
  commit:
    description: 'The commit created on the branch. Empty when nothing changed and nothing was committed.'
    value: ${{ steps.commit.outputs.commit }}
  files:
    description: 'The files the commit changed, one per line. Empty when nothing changed.'
    value: ${{ steps.commit.outputs.files }}
  distribution:
    description: >-
      Which pup distribution the release carries. On a run that succeeds it is `phar`, the only
      distribution the action runs today.
    value: ${{ steps.prepare.outputs.distribution }}

runs:
  using: 'composite'
  steps:
    - name: Check the inputs, bump the version and replace the TBDs
      id: prepare
      uses: actions/github-script@v9
      env:
        # github-script's require() resolves against the workspace of the repository being built,
        # not this action's directory, so the path has to be passed in. github.action_path is the
        # documented expression for it.
        ACTION_PATH: ${{ github.action_path }}
        # Read from process.env rather than interpolated into the script, so an input is data and
        # never part of the program.
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DATE: ${{ inputs.date }}
        INPUT_PUP_VERSION: ${{ inputs.pup-version }}
        # Authenticates the 'latest' lookup against the GitHub API; a pinned pup-version
        # never calls the API.
        INPUT_TOKEN: ${{ inputs.token }}
      with:
        script: |
          const { runPrepare } = require(`${process.env.ACTION_PATH}/release-prep.js`)
          await runPrepare({ core, exec, env: process.env })

    # The resolved date, never inputs.date: this action writes the date it is given as it is, so
    # `today` would land in the changelog as the word and an empty value as an empty date.
    - name: Write the changelog
      uses: stellarwp/changelogger@v1
      with:
        command: write
        version: ${{ steps.prepare.outputs.version }}
        date: ${{ steps.prepare.outputs.date }}

    - name: Commit the preparation to the release branch
      id: commit
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        # The values the prepare step validated, not the raw inputs.
        INPUT_BRANCH: ${{ steps.prepare.outputs.branch }}
        INPUT_VERSION: ${{ steps.prepare.outputs.version }}
      with:
        # github-script builds its `github` client from its own token input, which defaults to
        # github.token: the action's token has to be handed over here or it is never used.
        github-token: ${{ inputs.token }}
        script: |
          const { runCommit } = require(`${process.env.ACTION_PATH}/release-prep.js`)
          await runCommit({ github, core, exec, env: process.env })
