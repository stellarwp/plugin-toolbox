# Creates or moves git tags through the GitHub API. Knows nothing about versions: pair it with
# .github/actions/resolve-floating-tags to move floating version tags, or hand it any tag name.
name: Move git tags
description: Creates or moves the named git tags so that they point at a commit

inputs:
  tags:
    description: >-
      The tags to create or move, separated by spaces or newlines, e.g. `v1 v1.2`. An empty value
      moves nothing and succeeds, so a caller passing another step's output needs no `if:` of its
      own. Names are tag names, not refs: pass `v1`, not `refs/tags/v1`.
    required: true
  sha:
    description: >-
      The commit the tags should point at. Defaults to the commit the workflow is running for, which
      on a `release` event is the commit the release tag names.
    required: false
    default: ''
  repository:
    description: 'The `<owner>/<repo>` to write the tags in. Defaults to the current repository.'
    required: false
    default: ''
  token:
    description: >-
      Token used to write the tag refs. It needs `contents: write` on the repository, so the job
      needs that permission too. Pass a PAT or app token instead when a ruleset protects the tags in
      a way the default token cannot satisfy.
    required: false
    default: ${{ github.token }}

outputs:
  created:
    description: 'The tags that did not exist and were created, space separated.'
    value: ${{ steps.move.outputs.created }}
  moved:
    description: 'The tags that already existed and were repointed, space separated.'
    value: ${{ steps.move.outputs.moved }}

runs:
  using: 'composite'
  steps:
    - name: Create or move the tags
      id: move
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        REPO="${INPUT_REPOSITORY:-$GITHUB_REPOSITORY}"
        SHA="${INPUT_SHA:-$GITHUB_SHA}"

        # Word splitting is intended: TAGS is a list, separated by spaces or newlines.
        # shellcheck disable=SC2086,SC2153
        set -- ${TAGS}

        if [ "$#" -eq 0 ]; then
          echo "No tags to move."
          {
            echo "created="
            echo "moved="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CREATED=()
        MOVED=()

        for TAG in "$@"; do
          # Each name goes into an API path, so reject anything that is not a plain tag name. git
          # forbids `..` in a ref name anyway, and refusing it here keeps a name from walking up out
          # of the tags namespace.
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "${TAG}" == *..* ]]; then
            echo "::error::Refusing to write '${TAG}': it is not a plain tag name."
            exit 1
          fi

          # A full ref would otherwise be written as a tag literally named refs/tags/v1.
          if [[ "${TAG}" == refs/* ]]; then
            echo "::error::Refusing to write '${TAG}': pass the tag name, e.g. '${TAG##*/}'."
            exit 1
          fi

          # Ask whether the ref exists rather than letting a failed PATCH fall through to a POST. A
          # PATCH also fails for a token without permission or a protected tag, and a fallback that
          # swallowed the error would report those as success.
          #
          # git/ref (singular) is the endpoint that 404s on a missing ref. git/refs (plural) matches
          # by prefix, so it answers 200 for `tags/v1` whenever 1.0.0 exists, with no v1 to update.
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            # The API is used rather than `git push --force` so that the tag name never disappears,
            # which is what keeps a Release attached to it.
            gh api "repos/${REPO}/git/refs/tags/${TAG}" \
              --method PATCH \
              --raw-field sha="${SHA}" \
              --field force=true \
              --silent
            echo "Moved ${TAG} to ${SHA}."
            MOVED+=( "${TAG}" )
          else
            gh api "repos/${REPO}/git/refs" \
              --method POST \
              --raw-field ref="refs/tags/${TAG}" \
              --raw-field sha="${SHA}" \
              --silent
            echo "Created ${TAG} at ${SHA}."
            CREATED+=( "${TAG}" )
          fi
        done

        {
          echo "created=${CREATED[*]-}"
          echo "moved=${MOVED[*]-}"
        } >> "$GITHUB_OUTPUT"
