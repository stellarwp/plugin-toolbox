name: Tests

# This repo's own checks. A bug here reaches every repo that pins a tag from it, so the logic in the
# actions is unit tested rather than only exercised by a real release.
#
# Run it locally: `node --test`

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The version actions/github-script@v9 runs the action scripts on, so the tests run on the
      # same one. There is nothing to install: the scripts have no dependencies of their own.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No path argument: `node --test <dir>` is read as a module to load rather than a directory
      # to search on some Node versions, including the 24.x the runner ships. Bare `node --test`
      # finds every *.test.js under the repository on all of them.
      - name: Run the unit tests
        run: node --test
