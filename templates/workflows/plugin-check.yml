name: Plugin Check

# Runs WordPress.org's Plugin Check on the plugin as it ships, and compares the error counts with
# the baseline the repository commits, `.plugin-check-baseline.json`.
#
# A file to copy into .github/workflows/ of a plugin repository, under any name. The work is in
# stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml. The repository needs a .puprc whose
# zip_name equals plugin-slug; pup itself is installed by the workflow. See the plugin-check-report
# action's README.
#
# Checks that do not fit the plugin go in a .plugin-check.json at the repository root, as
# {"exclude-checks": ["check_name"]}; or pass the `exclude-checks` input, which replaces the file.
#
# Run it locally: `wp plugin check <slug> --format=json > results.txt` in a local WordPress, then
# the compare command on that file. See "Running it locally" in the action's README.

on:
  pull_request:
  # The branches pull requests target. A push there keeps them honest after a merge.
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the older commit.
concurrency:
  group: plugin-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-check:
    # The most any job of the shared workflow asks for. A called workflow cannot go above this.
    permissions:
      contents: read # check out the repository
      issues: write # the pull request comment
      pull-requests: write # the pull request comment
    uses: stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml@main
    with:
      plugin-slug: my-plugin
      # The pup release your release build uses. It builds the plugin for the check.
      pup-version: '2.0.0'
