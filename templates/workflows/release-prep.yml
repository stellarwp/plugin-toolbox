name: Release Prep

# Prepares a release branch: bumps the version, replaces the @since TBD tags and writes the
# changelog, then commits that and pushes it to the branch. No pull request is opened, so the
# change is reviewed wherever the release is.
#
# A file to copy into .github/workflows/ of a plugin repository, not a workflow to call. The
# repository needs a .puprc and a changelogger config first; see the release-prep action's README.
#
# The inputs are the interface a release tool dispatches: `ref` and `version`, and an optional
# `date` for runs started by hand. Keep `date` optional: a tool that sends only `ref` and `version`
# refuses a workflow that requires more.
#
# Run it locally: you cannot, it pushes to a branch. Start it by hand with
# `gh workflow run release-prep.yml -f ref=release/4.17.0 -f version=4.17.0`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release branch to prepare and push to, e.g. release/4.17.0'
        required: true
        type: string
      version:
        description: 'Version to write, e.g. 4.17.0'
        required: true
        type: string
      date:
        description: 'Changelog date (YYYY-MM-DD). Empty or "today" writes today, in UTC'
        required: false
        type: string
        default: ''

# Two preparations of the same branch would both commit on top of the same checkout, and the second
# push would be refused. One group per branch makes the second wait for the first.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}

permissions:
  contents: read

jobs:
  prepare:
    # pup runs on PHP, which ubuntu-24.04 ships. Pinned so that stays true.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the action pushes the preparation to the branch
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # The action pushes with the token it is given, so the checkout keeps no credentials in
          # .git/config for a later step to find.
          persist-credentials: false

      # A changelog writing strategy that has to be built first, or a toolchain the repository needs,
      # is set up here, before the action.

      - uses: stellarwp/plugin-toolbox/.github/actions/release-prep@v1
        with:
          ref: ${{ inputs.ref }}
          version: ${{ inputs.version }}
          date: ${{ inputs.date }}
